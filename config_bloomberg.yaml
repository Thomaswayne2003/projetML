# Seconde version, après l'ouverture du test : données 1999-2026 et séries Bloomberg en référence.
# Même modèle, mêmes variables, même découpage final ; seule l'histoire d'entraînement s'allonge (1999-2021).
# Usage : NIKKEI_CONFIG=config_bloomberg.yaml python -m src.v2_bloomberg
# Les résultats vont dans runs/v2_bloomberg/ : la décision et l'évaluation figées de runs/ ne sont pas touchées.

runs: runs/v2_bloomberg

data:
  monthly: data/2_construites/dataset_monthly2.csv          # table mensuelle 1999-2026 (notebooks de collecte, version 2)
  dictionary: data/2_construites/dictionnaire_variables2.csv
  model_table: data/3_modele/dataset_model2.csv
  bloomberg: data/1_brutes/bloomberg                         # Tankan, IPC et VIX exportés de Bloomberg (non suivis par Git)

split:
  start: "1999-01-01"        # premier mois de la table mensuelle version 2
  train_end: "2021-12-31"
  validation_end: "2023-12-31"
  test_end: "2026-09-30"

features:
  news: [news_attention_6m, news_sent_w, news_dispo]
  price: [n225_mom_12m, n225_mom_3m, n225_vol_ewma]
  macro: [d_jgb10y_bp, tankan_large_manuf]
  fx: [carry_1m, eurjpy_rvol_1m]
  regime: [n225_vol_ewma, n225_ret_1m, vix]

targets:
  nikkei_up: target_up_next
  nikkei_down: y_baisse
  hedge: y_non_couvert

seed: 42
