<body class="visite">
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- écran d'attente -->
  <div class="attente" id="attente">
    <p class="attente-devise"></p>
    <div class="attente-pied">
      <span class="attente-pct" id="pct">0 %</span>
      <span class="attente-ligne"><i id="ligne"></i></span>
    </div>
  </div>

  <header class="entete">
    <a class="marque" href="index.html"><span class="sceau" aria-hidden="true">日経</span>Nikkei <small>225 · le projet</small></a>
    <div class="entete-droite">
      <nav class="modes cours" aria-label="Cours"><a data-cours="ml" href="?cours=ml">Applied ML</a><a data-cours="maths" href="?cours=maths">Maths</a></nav>
      <nav class="modes" aria-label="Mode">
        <a href="index.html" data-lien="index.html" aria-current="page">Visite</a>
        <a href="lecture.html" data-lien="lecture.html" id="vers-lecture">Lecture</a>
        <a href="en/index.html" data-langue="en" lang="en" hreflang="en" title="English version">EN</a>
      </nav>
      <button class="bouton-menu" type="button" aria-expanded="false">Menu <span class="points" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
    </div>
  </header>

  <!-- la rotonde : navigation entre les salles -->
  <nav class="rotonde-nav" id="rotonde-nav" aria-label="Salles">
    <button class="voisine precedente" type="button" id="precedente"></button>
    <div class="courante">
      <span class="courante-num" id="courante-num"></span>
      <button class="courante-nom" type="button" id="courante-nom"></button>
      <span class="courante-aide">Cliquer pour entrer</span>
    </div>
    <button class="voisine suivante" type="button" id="suivante"></button>
  </nav>

  <!-- dans une salle -->
  <section class="salle-ui" id="salle-ui" aria-live="polite">
    <button class="retour" type="button" id="retour">Retour</button>
    <aside class="cartel" id="cartel"></aside>
    <a class="bouton-sombre lire" id="lire" href="lecture.html"></a>
  </section>

  <!-- aide au premier passage -->
  <div class="aide" id="aide" hidden>
    <div class="aide-gestes">
      <p><b>Clic</b><span>Entrer dans une salle</span></p>
      <p><b>Glisser</b><span>Regarder autour</span></p>
      <p><b>Défiler ou ← →</b><span>Passer d'une salle à l'autre</span></p>
    </div>
    <p class="aide-fermer">Cliquer n'importe où pour fermer</p>
  </div>

  <p class="pied-visite"><span id="pied-ecole"></span></p>
